name: CloudMor Remote release

# Builds the CloudMor-branded RustDesk client (Windows x64 MSI/EXE, macOS arm64/x86_64 DMG)
# and publishes it to the GitHub release named by `tag`. Repo: CloudMor-Technology/cloudmor-remote.

on:
  # Pushing a change to .cloudmor-release (the release tag name) builds and publishes it.
  push:
    branches: [cloudmor]
    paths: ['.cloudmor-release']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish to
        default: cloudmor-1.4.9
        required: true
      macos:
        description: Also build macOS (Mac runners cost ~10x Linux/Windows)
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/cloudmor-flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ inputs.tag || vars.CLOUDMOR_RELEASE_TAG || 'cloudmor-1.4.9' }}
      build-macos: ${{ github.event_name != 'workflow_dispatch' || inputs.macos }}
